<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>

    <div class="container">                            
        <h1>Currency Converter</h1>                            
        <p class="subtitle">Convert currencies in real time instantly</p>
        <form>
            <div class="amount">
                <p>Enter Amount</p>
                <input type="number" placeholder="Enter Amount" value="100" min="1"/>
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="USA Flag">
                        <select name="from"></select>
                    </div>
                </div>
                <div class="icon">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>
                <div class="to">
                    <p>To</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="India Flag">
                        <select name="to"></select>
                    </div>
                </div>
            </div>
            <!-- Exchange Rate Output -->
            <div class="msg">
                1 USD = 83 INR
            </div>
            <button type="submit">
                Get Exchange Rate
            </button>
        </form>
        <footer>
            Real-Time Currency Exchange Web App
        </footer>
    </div>
    <script src="code.js"></script>
    <script src="app.js"></script>

</body>
</html>
